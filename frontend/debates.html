<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debates - POLITIC-SANDBOX</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/debates.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <img src="img/logo.svg" alt="POLITIC-SANDBOX Logo">
                <h1>POLITIC-SANDBOX</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="debates.html" class="active">Debates</a></li>
                    <li><a href="#" id="profile-link">Perfil</a></li>
                    <li><a href="#" id="logout-btn">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="debates-header">
            <h2>Debates Políticos Estudiantiles</h2>
            <button id="new-debate-btn" class="btn primary-btn">Crear Nuevo Debate</button>
        </section>

        <section class="filters">
            <div class="filter-group">
                <label for="category-filter">Categoría:</label>
                <select id="category-filter">
                    <option value="">Todas</option>
                    <option value="politica_universitaria">Política Universitaria</option>
                    <option value="reformas_educativas">Reformas Educativas</option>
                    <option value="derechos_estudiantiles">Derechos Estudiantiles</option>
                    <option value="bienestar_estudiantil">Bienestar Estudiantil</option>
                    <option value="otros">Otros</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sort-by">Ordenar por:</label>
                <select id="sort-by">
                    <option value="recent">Más recientes</option>
                    <option value="popular">Más populares</option>
                    <option value="commented">Más comentados</option>
                    <option value="views">Más vistos</option>
                </select>
            </div>
            <div class="search-group">
                <input type="text" id="search-debates" placeholder="Buscar debates...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </section>

        <section id="debates-list" class="debates-list">
            <!-- Los debates se cargarán dinámicamente aquí -->
            <div class="loading-spinner" id="debates-loading">
                <div class="spinner"></div>
                <p>Cargando debates...</p>
            </div>
        </section>

        <div class="pagination" id="debates-pagination">
            <!-- La paginación se generará dinámicamente -->
        </div>
    </main>

    <!-- Modal para crear/editar debate -->
    <div id="debate-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="debate-modal-title">Crear Nuevo Debate</h2>
            <form id="debate-form">
                <div class="form-group">
                    <label for="debate-title">Título:</label>
                    <input type="text" id="debate-title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="debate-category">Categoría:</label>
                    <select id="debate-category" name="category" required>
                        <option value="politica_universitaria">Política Universitaria</option>
                        <option value="reformas_educativas">Reformas Educativas</option>
                        <option value="derechos_estudiantiles">Derechos Estudiantiles</option>
                        <option value="bienestar_estudiantil">Bienestar Estudiantil</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="debate-tags">Etiquetas (separadas por comas):</label>
                    <input type="text" id="debate-tags" name="tags" placeholder="ej: elecciones, reforma, becas">
                </div>
                <div class="form-group">
                    <label for="debate-content">Contenido:</label>
                    <textarea id="debate-content" name="content" rows="10" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn secondary-btn" id="cancel-debate">Cancelar</button>
                    <button type="submit" class="btn primary-btn">Publicar Debate</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para ver debate completo -->
    <div id="view-debate-modal" class="modal">
        <div class="modal-content debate-view-content">
            <span class="close-modal">&times;</span>
            <div id="debate-detail">
                <!-- El detalle del debate se cargará dinámicamente aquí -->
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Cargando debate...</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023 POLITIC-SANDBOX. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/debates.js"></script>
</body>
</html>
