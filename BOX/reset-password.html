<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLITIC-SANDBOX - Nueva Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-section">
                <h1>POLITIC-SANDBOX</h1>
                <p class="subtitle">Crear nueva contraseña</p>
            </div>

            <div class="form-section">
                <form id="resetForm" class="auth-form active">
                    <div class="input-group">
                        <label for="newPassword">Nueva Contraseña</label>
                        <input type="password" id="newPassword" required minlength="8">
                        <span class="error-message" id="newPasswordError"></span>
                    </div>

                    <div class="input-group">
                        <label for="confirmNewPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmNewPassword" required minlength="8">
                        <span class="error-message" id="confirmNewPasswordError"></span>
                    </div>

                    <button type="submit" class="submit-btn">Guardar Nueva Contraseña</button>
                </form>
            </div>
        </div>
    </div>

    <div id="messageContainer" class="message-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
